# Sansar default configuration.
#
# Committed defaults for every experiment. Machine-specific values (device,
# data paths) go in configs/local.yaml (gitignored) — same structure, only the
# keys you want to override. CLI overrides win over both:
#     python scripts/play.py env.render_hz=50 runtime.device=cpu

runtime:
  device: auto        # auto | cpu | mps | cuda  (auto picks cuda > mps > cpu)
  seed: 42

env:
  name: driving_v0
  sim_hz: 50          # simulation frequency (fixed timestep)
  render_hz: 50       # visualization frequency (decoupled from sim).
                      # 10 Hz is the neural-demo target; at 10 the 2 m dash
                      # pattern aliases at certain speeds and looks frozen.

  road:
    kind: straight    # straight | curved
    half_width: 3.0   # meters, centerline to edge
    # used only when kind == curved:
    curve_amplitude: 1.5    # meters of lateral centerline sway
    curve_wavelength: 80.0  # meters of travel per full sway cycle

  car:
    half_width: 0.4       # meters
    half_length: 0.9      # meters, used for obstacle collision
    initial_speed: 8.0    # m/s
    max_speed: 13.9       # m/s (~50 km/h)
    accel: 2.0            # m/s^2, passive acceleration toward max_speed
    steer_rate: 2.5       # rad/s of heading change while steering
    max_heading: 0.6      # rad, heading clamp
    self_center_rate: 3.0 # rad/s heading decay toward straight when not
                          # steering — quick arcade turns instead of a
                          # steering wheel that stays turned forever
    # collision behavior: car is clamped to the road edge and slowed,
    # keeping episodes continuous (rich boundary data for training)
    collision_speed_factor: 0.90   # per-step speed multiplier while scraping
    collision_min_speed: 3.0       # m/s floor so the car never stalls

  # Blockers on the road. Their layout is a deterministic function of
  # (seed, distance) — static world geometry like the road itself, so the
  # dynamic state the neural engine must predict stays just the car.
  obstacles:
    enabled: true
    seed: 7
    first_at: 60.0        # meters before the first blocker
    spacing: 45.0         # mean meters between blockers
    jitter: 20.0          # +/- meters of per-blocker spacing noise
    half_width: 0.7       # meters
    half_length: 0.8      # meters
    edge_margin: 0.3      # meters kept clear between blocker and road edge
    slow_factor: 0.85     # per-step speed multiplier while overlapping

game:
  mode: play               # play | duel (neural solid car vs classic ghost, same inputs)
  engine: classic          # classic | neural (play mode only; duel always runs both)
  checkpoint: experiments/m3_long/model.pt   # used when engine == neural
  neural_device: cpu       # single-step inference is latency-bound; cpu wins

render:
  window_width: 420
  window_height: 640
  pixels_per_meter: 40   # lateral world-to-screen scale

data:
  out_dir: data_out      # episode logs land here (gitignored)
  run_name: v0           # episodes saved to <out_dir>/<run_name>/
  episodes: 200
  steps: 3000            # per episode: 60 s of sim time at 50 Hz
  seed: 123
  # scripted driver mix (weights, normalized automatically). Coverage matters
  # more than volume: the model must see boundaries, collisions, and the
  # weird inputs a human player will produce.
  policy_mix:
    lane: 0.40           # noisy lane-following that dodges blockers (typical play)
    random: 0.20         # sticky random actions (state-space coverage)
    swerve: 0.20         # sinusoidal steering (dynamic-range coverage)
    wall: 0.20           # deliberately hits walls/blockers, then recovers

model:
  context: 32            # past (state, action) steps the transformer sees (0.64 s)
  d_model: 128
  n_layers: 4
  n_heads: 4
  dropout: 0.0

train:
  run_name: m3
  data_run: v0           # dataset under data.out_dir to train on
  val_episodes: 20       # last N episodes held out for validation
  batch_size: 256
  lr: 3e-4
  weight_decay: 0.01
  steps: 6000            # optimizer steps
  # pushforward rollout curriculum: [optimizer_step, rollout_k]. Training
  # rolls the model on its own (detached) predictions for k steps so it
  # learns to correct compounding error — the long-horizon stability trick.
  rollout_curriculum: [[0, 1], [2000, 4], [4000, 8]]
  collision_loss_weight: 1.0
  eval_every: 500
  eval_horizon: 50       # rollout length for validation metrics
  eval_windows: 256

experiment:
  out_dir: experiments   # checkpoints, logs, config snapshots (gitignored)
